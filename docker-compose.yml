name: capstone

services:
  # ============================================================================
  # 1. ORACLE DATABASE (Master System of Record & Pessimistic Row Locking)
  # ============================================================================
  oracle-core-db:
    image: gvenzl/oracle-free:latest
    container_name: oracle-core-db
    ports:
      - "${ORACLE_PORT:-1522}:1521"
      - "${ORACLE_OEM_PORT:-5501}:5500"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?ORACLE_PASSWORD is required}
      APP_USER: ${APP_USER:-core_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD is required}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-XEPDB1}
    volumes:
      - ./database/oracle:/container-entrypoint-initdb.d:ro
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "printf 'WHENEVER SQLERROR EXIT SQL.SQLCODE\\nSELECT 1 FROM dual;\\nEXIT;\\n' | sqlplus -L -s ${APP_USER:-core_user}/${APP_USER_PASSWORD}@//localhost:1521/${ORACLE_DATABASE:-XEPDB1} | grep -Eq '^[[:space:]]*1[[:space:]]*$' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 36
      start_period: 60s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 2. POSTGRESQL (Immutable Forensic Audit Store & SHA-256 Hash Chaining)
  # ============================================================================
  postgres-audit-db:
    image: postgres:16-alpine
    container_name: postgres-audit-db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-audit_store}
    volumes:
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-audit_store}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 3. REDIS (Distributed Idempotency Pre-flight Lock & Balance Cache)
  # ============================================================================
  redis-cache:
    image: redis:7.4-alpine
    container_name: redis-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 4. APACHE KAFKA (KRaft Mode Single Broker Event Streaming)
  # ============================================================================
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka-broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L62EnNxTQl-GHmeeAhCwA}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 5. KAFKA TOPIC INITIALIZER (Auto-creates domain topics on boot)
  # ============================================================================
  kafka-init-topics:
    image: apache/kafka:latest
    container_name: kafka-init-topics
    depends_on:
      kafka-broker:
        condition: service_healthy
    entrypoint: ["/bin/bash"]
    command:
      - "-c"
      - |
        echo "Creating core banking topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:29092 --create --if-not-exists --topic ledger.mutation.completed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:29092 --create --if-not-exists --topic ledger.transfer.completed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:29092 --create --if-not-exists --topic account.closure.completed.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:29092 --create --if-not-exists --topic account.created.v1 --partitions 3 --replication-factor 1
        echo "Available topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker:29092 --list
    networks:
      - core-banking-net

  # ============================================================================
  # 6. KAFKA UI (Browser-based Visual Inspection for Topics & Consumer Groups)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8088}:8080"
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local-core-banking-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 7. LEDGER SERVICE (Core Banking Double-Entry Mutation & Transfer Engine)
  # ============================================================================
  ledger-service:
    profiles:
      - app
    build:
      context: ./backend/ledger-service
      dockerfile: Dockerfile
    container_name: ledger-service
    ports:
      - "${LEDGER_PORT:-8083}:8083"
    depends_on:
      oracle-core-db:
        condition: service_healthy
      postgres-audit-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      ORACLE_HOST: oracle-core-db
      ORACLE_PORT: 1521
      ORACLE_DATABASE: ${ORACLE_DATABASE:-XEPDB1}
      APP_USER: ${APP_USER:-core_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD is required}
      POSTGRES_HOST: postgres-audit-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-audit_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 8. AUTH SERVICE (Core Banking Identity, Registration & Token Authority)
  # ============================================================================
  auth-service:
    profiles:
      - app
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      oracle-core-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      ORACLE_HOST: oracle-core-db
      ORACLE_PORT: 1521
      ORACLE_DATABASE: ${ORACLE_DATABASE:-XEPDB1}
      APP_USER: ${APP_USER:-core_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD is required}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 9. ACCOUNT SERVICE (Customer Profiles, KYC & Account Lifecycle Management)
  # ============================================================================
  account-service:
    profiles:
      - app
    build:
      context: ./backend/account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "${ACCOUNT_PORT:-8082}:8082"
    depends_on:
      oracle-core-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      ORACLE_HOST: oracle-core-db
      ORACLE_PORT: 1521
      ORACLE_DATABASE: ${ORACLE_DATABASE:-XEPDB1}
      APP_USER: ${APP_USER:-core_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?APP_USER_PASSWORD is required}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 10. NOTIFICATION SERVICE (Real-time Event Consumer & Customer In-App Feed)
  # ============================================================================
  notification-service:
    profiles:
      - app
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"
    depends_on:
      kafka-broker:
        condition: service_healthy
      postgres-audit-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      KAFKA_CONSUMER_GROUP: notification-service-group
      DATABASE_URL: jdbc:postgresql://postgres-audit-db:5432/${POSTGRES_DB:-audit_store}
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 11. AUDIT SERVICE (Forensic Audit Ledger, Statement & Integrity Verification)
  # ============================================================================
  audit-service:
    profiles:
      - app
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    ports:
      - "${AUDIT_PORT:-8085}:8085"
    depends_on:
      postgres-audit-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      POSTGRES_HOST: postgres-audit-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-audit_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 12. API GATEWAY (Spring Cloud Gateway - Unified Edge Ingress & Routing)
  # ============================================================================
  api-gateway:
    profiles:
      - app
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      AUDIT_SERVICE_URL: http://audit-service:8085
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 13. PROMETHEUS (Time-Series Metrics Collection & Alerting)
  # ============================================================================
  prometheus:
    profiles:
      - observability
      - full
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 14. GRAFANA (Unified Operational Dashboards & SLA Monitoring)
  # ============================================================================
  grafana:
    profiles:
      - observability
      - full
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - core-banking-net

  # ============================================================================
  # 15. JAEGER (Distributed Tracing & W3C Span Waterfall Visualizer)
  # ============================================================================
  jaeger:
    profiles:
      - tracing
      - full
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - core-banking-net

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  oracle_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  core-banking-net:
    driver: bridge

