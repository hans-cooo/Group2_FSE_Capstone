server.port=${SERVER_PORT:8084}
spring.application.name=notification-service

# Database Configuration (Defaults to embedded H2 for plug-and-play, supports PostgreSQL via env)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topics
notification.kafka.topics.mutation=${KAFKA_TOPIC_MUTATION:ledger.mutation.completed.v1}
notification.kafka.topics.transfer=${KAFKA_TOPIC_TRANSFER:ledger.transfer.completed.v1}
notification.kafka.topics.account-closure=${KAFKA_TOPIC_ACCOUNT_CLOSURE:account.closure.completed.v1}

# Security Configuration
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Actuator & Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
