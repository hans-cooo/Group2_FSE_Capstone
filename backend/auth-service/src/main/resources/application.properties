server.port=${SERVER_PORT:8081}
spring.application.name=auth-service

# ==============================================================================
# Oracle XE (Master System of Record for Credentials & Roles)
# ==============================================================================
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1522}/${ORACLE_DATABASE:XEPDB1}
spring.datasource.username=${APP_USER:core_user}
spring.datasource.password=${APP_USER_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ==============================================================================
# JPA / Hibernate Configurations
# ==============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ==============================================================================
# Redis Configuration (Token Blacklist, Refresh Tokens, MFA Challenges)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ==============================================================================
# Security & JWT Configuration (Aligned with Ledger Service)
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Multi-Factor Authentication (MFA / 2FA) & OTP Delivery Configuration
# ==============================================================================
app.security.mfa.enabled=${MFA_ENABLED:false}
app.security.mfa.default-channel=${MFA_DEFAULT_CHANNEL:SMS}

# SMS Provider Settings (MOCK, SEMAPHORE, TWILIO)
app.security.sms.provider=${SMS_PROVIDER:MOCK}
app.security.sms.semaphore.api-key=${SEMAPHORE_API_KEY:}
app.security.sms.semaphore.sender-name=${SEMAPHORE_SENDER_NAME:COREBANK}
app.security.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.security.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.security.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# Email Provider Settings (MOCK, SMTP)
app.security.email.provider=${EMAIL_PROVIDER:MOCK}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
app.security.email.from=${SMTP_FROM_EMAIL:noreply@corebank.ph}

# ==============================================================================
# Actuator & Probes
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.probes.enabled=true

