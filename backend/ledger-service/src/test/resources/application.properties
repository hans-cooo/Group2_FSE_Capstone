# ==============================================================================
# Test-Scoped Configuration for Unit / Slices / Context Integration Testing
# ==============================================================================
spring.application.name=ledger-service-test

# Oracle Test DB Configuration
ORACLE_HOST=localhost
ORACLE_PORT=1522
ORACLE_DATABASE=XEPDB1
APP_USER=core_user
APP_USER_PASSWORD=CorePassword123!

spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/XEPDB1
spring.datasource.username=core_user
spring.datasource.password=CorePassword123!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# PostgreSQL Test DB Configuration
POSTGRES_HOST=localhost
POSTGRES_PORT=5434
POSTGRES_DB=audit_store
POSTGRES_USER=postgres
POSTGRES_PASSWORD=AuditPassword123!

postgres.datasource.url=jdbc:postgresql://localhost:5434/audit_store
postgres.datasource.username=postgres
postgres.datasource.password=AuditPassword123!
postgres.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Redis Configuration (Distributed Idempotency Mutex & Balance Cache)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Security, JWT & CORS Configuration
JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
JWT_EXPIRATION_MS=86400000
CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173

# Apache Kafka Event Streaming Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

ledger.kafka.topics.mutation=ledger.mutation.completed.v1
ledger.kafka.topics.transfer=ledger.transfer.completed.v1
