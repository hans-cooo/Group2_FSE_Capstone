spring.application.name=ledger-service

# ==============================================================================
# Primary Datasource: Oracle (Master System of Record & Row Locks -> JPA)
# ==============================================================================
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_DATABASE:XEPDB1}
spring.datasource.username=${APP_USER:core_user}
spring.datasource.password=${APP_USER_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5

# ==============================================================================
# Secondary Datasource: PostgreSQL (Immutable Forensic Audit Store -> JdbcTemplate)
# ==============================================================================
postgres.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:audit_store}
postgres.datasource.username=${POSTGRES_USER:postgres}
postgres.datasource.password=${POSTGRES_PASSWORD}
postgres.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configurations
# ==============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ==============================================================================
# Redis Configuration (Distributed Idempotency Mutex & Balance Cache)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ==============================================================================
# Security, JWT & CORS Configuration
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Apache Kafka Event Streaming Configuration (Epic E / FSE-501)
# ==============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

ledger.kafka.topics.mutation=${LEDGER_MUTATION_TOPIC:ledger.mutation.completed.v1}
ledger.kafka.topics.transfer=${LEDGER_TRANSFER_TOPIC:ledger.transfer.completed.v1}
