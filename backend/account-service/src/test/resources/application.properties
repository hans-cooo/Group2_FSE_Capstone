server.port=8082
spring.application.name=account-service-test

# Oracle Test Datasource
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1522}/${ORACLE_DATABASE:XEPDB1}
spring.datasource.username=${APP_USER:core_user}
spring.datasource.password=${APP_USER_PASSWORD:CorePassword123!}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# JWT & CORS Test Configuration
app.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.security.jwt.expiration-ms=86400000
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Kafka Test Configuration
spring.kafka.bootstrap-servers=localhost:9092
account.kafka.topics.closure=account.closure.completed.v1
account.kafka.topics.created=account.created.v1

management.endpoints.web.exposure.include=health,info
