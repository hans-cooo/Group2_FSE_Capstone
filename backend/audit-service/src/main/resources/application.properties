spring.application.name=audit-service
server.port=${SERVER_PORT:8085}

# ==============================================================================
# PostgreSQL Database Configuration (Port 5434 / schema: audit_store)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:audit_store}}
spring.datasource.username=${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# Hibernate / JPA Settings
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=audit_store

# ==============================================================================
# Security, JWT & CORS Configuration
# ==============================================================================
app.security.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1ncm91cDItZnNlLWNhcHN0b25lLXByb2plY3QtMjAyNQ==}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Actuator & Observability
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always