name: Core Banking CI - Build, Test & Integrity Pipeline

on:
  push:
    branches: [ main, master, dev, develop, "feat/**", "feature/**", "fix/**", "phase/**" ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Configuration, Scripts & Compose Syntax Validation
  # ============================================================================
  validate-config:
    name: 1. Validate Docker Compose, Scripts & Environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Verify environment template
        run: |
          echo "Copying .env.example to .env..."
          cp .env.example .env
          test -f .env || (echo ".env missing!" && exit 1)

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose config --quiet
          echo "docker-compose.yml syntax is valid."

      - name: Validate shell scripts syntax
        run: |
          echo "Checking syntax of all shell scripts..."
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
              echo "  [VALID] $script"
            fi
          done

      - name: Verify core project directories & artifacts
        run: |
          test -f backend/ledger-service/pom.xml || (echo "backend/ledger-service/pom.xml missing!" && exit 1)
          test -f backend/ledger-service/mvnw || (echo "Maven wrapper missing!" && exit 1)
          test -f database/oracle/01_init_user.sql || (echo "Oracle init SQL missing!" && exit 1)
          test -f database/postgres/01_init_db.sql || (echo "Postgres init SQL missing!" && exit 1)
          echo "Core file layout verified."

  # ============================================================================
  # JOB 2: PostgreSQL Immutable Audit Store & Cryptographic Triggers
  # ============================================================================
  test-postgres-audit-store:
    name: 2. Test PostgreSQL Cryptographic Audit Store
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Start PostgreSQL 16 Service Container
        run: |
          docker run -d \
            --name pg-ci \
            -e POSTGRES_PASSWORD=AuditPassword123! \
            -e POSTGRES_DB=audit_store \
            -p 5432:5432 \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          until docker exec pg-ci pg_isready -U postgres -d audit_store; do
            sleep 2
          done

      - name: Execute DDL & Trigger Scripts
        run: |
          echo "Applying 01_init_db.sql..."
          docker exec -i pg-ci psql -U postgres -d audit_store < database/postgres/01_init_db.sql

          echo "Applying 02_create_tables.sql..."
          docker exec -i pg-ci psql -U postgres -d audit_store < database/postgres/02_create_tables.sql

          echo "Applying 03_audit_triggers.sql..."
          docker exec -i pg-ci psql -U postgres -d audit_store < database/postgres/03_audit_triggers.sql

          echo "Applying 04_seed_data.sql..."
          docker exec -i pg-ci psql -U postgres -d audit_store < database/postgres/04_seed_data.sql

      - name: Verify Single Source of Truth (SSOT) Isolation
        run: |
          SSOT_COUNT=$(docker exec pg-ci psql -U postgres -d audit_store -t -A -c "SELECT count(*) FROM information_schema.schemata WHERE schema_name = 'core_banking';")
          if [ "$SSOT_COUNT" -eq "0" ]; then
            echo "PASS: Single Source of Truth verified. No business tables in PostgreSQL."
          else
            echo "FAIL: Unexpected core_banking schema found in PostgreSQL!"
            exit 1
          fi

      - name: Verify Cryptographic SHA-256 Hash Chaining
        run: |
          COUNT=$(docker exec pg-ci psql -U postgres -d audit_store -t -A -c "SELECT count(*) FROM audit_store.ledger_mutation_audit;")
          if [ "$COUNT" -ge 3 ]; then
            echo "PASS: $COUNT seed audit entries confirmed."
          else
            echo "FAIL: Expected >= 3 audit entries, found $COUNT"
            exit 1
          fi

          HASH=$(docker exec pg-ci psql -U postgres -d audit_store -t -A -c "SELECT current_hash FROM audit_store.ledger_mutation_audit ORDER BY audit_id ASC LIMIT 1;")
          HASH_LEN=${#HASH}
          if [ "$HASH_LEN" -eq 64 ]; then
            echo "PASS: Cryptographic SHA-256 hash length verified ($HASH)."
          else
            echo "FAIL: Hash length is $HASH_LEN (expected 64)"
            exit 1
          fi

      - name: Verify Immutability Guard (Trigger must reject UPDATE & DELETE)
        run: |
          echo "Attempting illegal UPDATE on audit record..."
          OUTPUT=$(docker exec pg-ci psql -U postgres -d audit_store -c "UPDATE audit_store.ledger_mutation_audit SET amount = 999999 WHERE audit_id = 1;" 2>&1 || true)
          echo "Database response: $OUTPUT"

          if echo "$OUTPUT" | grep -q "COMPLIANCE VIOLATION" && echo "$OUTPUT" | grep -q "55000"; then
            echo "PASS: Immutability trigger successfully blocked illegal UPDATE with ERRCODE 55000."
          else
            echo "FAIL: Immutability trigger did not block illegal UPDATE!"
            exit 1
          fi

  # ============================================================================
  # JOB 3: Redis & Kafka KRaft Integration Test
  # ============================================================================
  test-redis-and-kafka:
    name: 3. Test Redis Idempotency & Kafka KRaft
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Spin up Redis and Kafka via Docker Compose
        run: |
          docker compose up -d redis-cache kafka-broker kafka-init-topics

          echo "Waiting for Kafka and Redis to be healthy..."
          timeout 60s bash -c '
            until docker exec redis-cache redis-cli ping | grep -q "PONG"; do
              sleep 2
            done
          '
          echo "Redis is healthy."

          timeout 60s bash -c '
            until docker exec kafka-broker /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list | grep -q "ledger.mutation.completed.v1"; do
              sleep 3
            done
          '
          echo "Kafka topic ledger.mutation.completed.v1 initialized."

      - name: Test Redis SETNX Idempotency Locks
        run: |
          KEY="idemp:txn:ci-test-$(date +%s)"
          FIRST=$(docker exec redis-cache redis-cli SET "$KEY" "PROCESSING" EX 30 NX)
          RETRY=$(docker exec redis-cache redis-cli SET "$KEY" "PROCESSING" EX 30 NX)

          if [ "$FIRST" = "OK" ] && [ -z "$RETRY" ]; then
            echo "PASS: Redis atomic SETNX idempotency lock operational."
          else
            echo "FAIL: Redis SETNX test failed (first=$FIRST, retry=$RETRY)"
            exit 1
          fi

      - name: Test Kafka Produce & Consume Round-trip
        run: |
          TEST_PAYLOAD='{"eventId":"ci-101","accountId":"ACC_1001","amount":500.0000,"status":"COMPLETED"}'
          
          echo "Producing test event to Kafka..."
          echo "$TEST_PAYLOAD" | docker exec -i kafka-broker /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 \
            --topic ledger.mutation.completed.v1

          echo "Consuming test event from Kafka..."
          CONSUMED=$(docker exec kafka-broker /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 \
            --topic ledger.mutation.completed.v1 \
            --from-beginning \
            --max-messages 1 \
            --timeout-ms 5000)

          if echo "$CONSUMED" | grep -q "ACC_1001"; then
            echo "PASS: Kafka event streaming verified round-trip."
          else
            echo "FAIL: Did not consume produced message. Output: $CONSUMED"
            exit 1
          fi

  # ============================================================================
  # JOB 4: Oracle SQL Script Validation
  # ============================================================================
  validate-oracle-ddl:
    name: 4. Validate Oracle DDL Syntax & Tables
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate Oracle DDL Structure
        run: |
          echo "Checking Oracle DDL files exist..."
          test -f database/oracle/01_init_user.sql
          test -f database/oracle/02_create_tables.sql
          test -f database/oracle/03_seed_data.sql

          # Verify all 13 ERD tables are declared in 02_create_tables.sql
          TABLES=("ROLE" "USER" "CUSTOMER" "KYC" "KYC_UPDATE_REQUEST" "ACCOUNT" "BALANCE" "TRANSFER_REQUEST" "ACCOUNT_FLAG" "TRANSACTION" "TRANSACTION_FLAG" "SYSTEM_LOG" "TRANSACTION_AUDIT")
          
          for tbl in "${TABLES[@]}"; do
            if grep -qi "CREATE TABLE.*$tbl" database/oracle/02_create_tables.sql; then
              echo "  [FOUND] Table definition for $tbl"
            else
              echo "  [MISSING] Table definition for $tbl!"
              exit 1
            fi
          done

          echo "PASS: All 13 ERD tables properly defined for Oracle Master."

  # ============================================================================
  # JOB 5: Java 21 Spring Boot Backend Build & Test Suite
  # ============================================================================
  build-and-test-backend:
    name: 5. Build & Test Ledger Engine (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Prepare environment configuration
        run: |
          cp .env.example .env

      - name: Set up Java 21 JDK (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Spin up Database & Cache Infrastructure via Docker Compose
        run: |
          echo "Starting Oracle XE, PostgreSQL and Redis containers..."
          docker compose up -d oracle-core-db postgres-audit-db redis-cache

          echo "Waiting for Redis to become healthy..."
          timeout 45s bash -c '
            until docker exec redis-cache redis-cli ping | grep -q "PONG"; do
              sleep 2
            done
          '
          echo "Redis is healthy."

          echo "Waiting for PostgreSQL to become healthy..."
          timeout 45s bash -c '
            until docker exec postgres-audit-db pg_isready -U postgres -d audit_store; do
              sleep 2
            done
          '
          echo "PostgreSQL is healthy."

      - name: Wait for Oracle XEPDB1 service registration
        run: |
          set -e
          echo "Waiting for Oracle XE listener to register XEPDB1 service..."

          timeout 180s bash -c '
            until docker exec oracle-core-db bash -lc "
              lsnrctl services 2>/dev/null | grep -q \"Service.*XEPDB1\"
            "; do
              echo "XEPDB1 is not registered with listener yet..."
              sleep 5
            done
          '

          echo "Waiting for XEPDB1 to accept SQL queries..."
          timeout 60s bash -c '
            until docker exec oracle-core-db bash -lc "
              printf \"SELECT 1 FROM dual;\\nEXIT;\\n\" |
              sqlplus -s core_user/CorePassword123!@//localhost:1521/XEPDB1 |
              grep -Eq \"^[[:space:]]*1[[:space:]]*$\"
            "; do
              echo "XEPDB1 is registered but not accepting queries yet..."
              sleep 5
            done
          '

          echo "Oracle XE XEPDB1 is ready."

      - name: Verify Oracle port reachable from runner host
        run: |
          timeout 60s bash -c '
            until nc -z 127.0.0.1 1521; do
              echo "Waiting for port 1521 on runner..."
              sleep 2
            done
          '
          echo "Oracle port 1521 is reachable from the GitHub runner."

      - name: Compile and Run Full Backend Test Suite
        run: |
          cd backend/ledger-service
          chmod +x mvnw
          ./mvnw clean test -B --no-transfer-progress

      - name: Publish Surefire Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-test-reports
          path: backend/ledger-service/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # JOB 6: CI Quality Gate (Branch Protection Required Check)
  # ============================================================================
  ci-quality-gate:
    name: 6. Core Banking CI Quality Gate
    runs-on: ubuntu-latest
    needs:
      - validate-config
      - test-postgres-audit-store
      - test-redis-and-kafka
      - validate-oracle-ddl
      - build-and-test-backend
    if: always()
    steps:
      - name: Evaluate All Pipeline Checks
        run: |
          echo "=========================================================="
          echo " Evaluating Core Banking Pipeline Quality Gate...         "
          echo "=========================================================="
          
          CONFIG_STATUS="${{ needs.validate-config.result }}"
          PG_STATUS="${{ needs.test-postgres-audit-store.result }}"
          REDIS_KAFKA_STATUS="${{ needs.test-redis-and-kafka.result }}"
          ORACLE_STATUS="${{ needs.validate-oracle-ddl.result }}"
          BACKEND_STATUS="${{ needs.build-and-test-backend.result }}"

          echo "1. Validate Config & Scripts:  $CONFIG_STATUS"
          echo "2. PostgreSQL Audit Store:    $PG_STATUS"
          echo "3. Redis & Kafka Backbone:    $REDIS_KAFKA_STATUS"
          echo "4. Oracle DDL Validation:     $ORACLE_STATUS"
          echo "5. Backend Java 21 Tests:     $BACKEND_STATUS"
          echo "=========================================================="

          if [ "$CONFIG_STATUS" != "success" ] || \
             [ "$PG_STATUS" != "success" ] || \
             [ "$REDIS_KAFKA_STATUS" != "success" ] || \
             [ "$ORACLE_STATUS" != "success" ] || \
             [ "$BACKEND_STATUS" != "success" ]; then
            echo "❌ QUALITY GATE FAILED: One or more pipeline stages did not pass."
            exit 1
          fi

          echo "✅ QUALITY GATE PASSED: All 5 validation suites succeeded. Safe to merge!"
